name: Tests

# Builds the Rust extensions in-place (build.py) and runs the headless test
# suite. PySide6/pytest-qt are intentionally NOT installed: the tests stub Qt at
# module level, and a real binding would defeat those stubs. numpy/matplotlib
# are real (parser math / spectrum widgets).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      moleditpy_ref:
        description: Moleditpy tag, branch or commit for API integration tests
        required: false
        default: 'v5.0.1'
        type: string

permissions:
  contents: read

env:
  MOLEDITPY_REF: ${{ inputs.moleditpy_ref || vars.MOLEDITPY_REF || 'v5.0.1' }}

jobs:
  test:
    name: Test ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9' && 'ubuntu-24.04' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build + test deps
        run: python -m pip install --upgrade pip maturin pytest pytest-cov numpy matplotlib rdkit

      - name: Build Rust extensions in-place
        run: python build.py

      - name: Fetch the main app API for integration tests
        shell: bash
        run: |
          git init ../python_molecular_editor
          git -C ../python_molecular_editor remote add origin https://github.com/HiroYokoyama/python_molecular_editor.git
          git -C ../python_molecular_editor fetch --depth 1 origin "$MOLEDITPY_REF"
          git -C ../python_molecular_editor checkout --detach FETCH_HEAD

      - name: Run tests
        env:
          CI_MAIN_APP_SRC: ../python_molecular_editor/moleditpy/src
        run: python run_tests.py tests/ -p pytest_cov --cov=orca_result_analyzer_rust --cov-report=term-missing --cov-report=xml -v --tb=short

  sync-check:
    name: Shared Python source parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: HiroYokoyama/moleditpy_orca_result_analyzer_plugin
          ref: d7f79374829da98c2f4c84dc6811504d0f5fc164
          path: canonical-python
          persist-credentials: false
      - run: python scripts/check_python_sync.py --source canonical-python
